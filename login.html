<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Welcome Back</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-4">

    <!-- Login Container -->
    <div class="container" style="max-width: 440px;">
        <!-- Header -->
        <div class="text-center mb-4">
            <div class="logo-box mx-auto mb-3">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M4 19V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14"></path>
                    <polyline points="4 9 12 15 20 9"></polyline>
                </svg>
            </div>
            <h2 class="fw-bold text-dark mb-1">Welcome Back!</h2>
            <p class="text-muted small">Sign in to continue to your account.</p>
        </div>

        <!-- Login Card -->
        <div class="card shadow-sm border-0 rounded-4 p-4 mb-4">
            <h4 class="fw-bold mb-1">Login to your account</h4>
            <p class="text-muted small mb-4">Enter your email and password to get started.</p>

            <form id="loginForm">
                <!-- Email Field -->
                <div class="mb-3">
                    <label for="email" class="form-label small fw-semibold">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="hana@gmail.com">
                    <div class="text-danger small mt-1" id="emailError"></div>
                </div>

                <!-- Password Field -->
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="password" class="form-label small fw-semibold mb-0">Password</label>
                        <a href="#" class="small text-decoration-none text-primary">Forgot password?</a>
                    </div>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" placeholder="Enter your password">
                        <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn">Show</button>
                    </div>
                    <div class="text-danger small mt-1" id="passwordError"></div>
                </div>

                <!-- Remember Me -->
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                    <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>

                <!-- Signup Link -->
                <p class="text-center text-muted small mt-4 mb-0">
                    Don't have an account? <a href="#" class="text-decoration-none fw-semibold">Create an account</a>
                </p>
            </form>
        </div>

        <!-- Footer -->
        <footer class="text-center text-muted small">
            <p class="mb-0">&copy; 2026 My Website. All rights reserved.</p>
        </footer>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
